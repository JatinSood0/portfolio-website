<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=width, initial-scale=1.0" >
    <title>First Website</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img class="image-gradient" src="gradient.png" alt="gradient">
    <div class="layer-blur"></div>

    <div class="container"> 
        <header class="header">
            <h1 data-aos="fade-down" data-aos-duration="1200" class="logo">JATIN SOOD</h1>
            <nav>
                <a data-aos="fade-down" data-aos-duration="1200" href="#">WORK</a>
                <a data-aos="fade-down" data-aos-duration="1700" href="#">TESTIMONIALS</a>
                <a data-aos="fade-down" data-aos-duration="2000" href="#">ABOUT ME</a>
            </nav>
            <button data-aos="fade-down" data-aos-duration="2300" class="btn-contact">CONTACT</button>
        </header>
        <main>
             <div class="content">
            <div  data-aos="fade-zoom-in"
             data-aos-easing="ease-in-back"
             data-aos-delay="300"
             data-aos-offset="0" data-aos-duration="1200" class="tag-box">
                <div class="tag">LATEST WORK</div>
            </div>

            <h1 data-aos="fade-zoom-in"
             data-aos-easing="ease-in-back"
             data-aos-delay="300"
             data-aos-offset="0" data-aos-duration="1500" >EDITING PORTFOLIO</h1>
            <p data-aos="fade-zoom-in"
             data-aos-easing="ease-in-back"
             data-aos-delay="300"
             data-aos-offset="0" data-aos-duration="1700" class="description">Over 20+ Videos made</p>

        </div>
        </main>

        <spline-viewer data-aos="fade-zoom-in"
             data-aos-easing="ease-in-back"
             data-aos-delay="300"
             data-aos-offset="0" data-aos-duration="1700" class="robot-3d" url="https://prod.spline.design/QzIfMDPZ9uDK-7Rp/scene.splinecode"></spline-viewer>

    </div>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.89/build/spline-viewer.js"></script>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</body>
</html>
